name: Calcul SST Quotidien

on:
  schedule:
    # S'exécute toutes les 5 minutes entre 09:00 UTC et 09:59 UTC chaque jour
    # (Soit de 11h00 à 11h59 du matin en heure française d'été)
    - cron: '*/5 9 * * *'
  workflow_dispatch: # Vous permet de toujours pouvoir le lancer manuellement en journée

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  run-sst:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les bibliothèques
        run: |
          pip install pandas gspread google-auth playwright
          playwright install chromium

      - name: Exécuter le script Python
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: python script.py
