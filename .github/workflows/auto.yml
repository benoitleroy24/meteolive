steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # LA LIGNE CORRIGÉE (Ajout de beautifulsoup4 et requests)
      - name: Installer les bibliothèques
        run: pip install numpy pandas xarray netcdf4 gspread google-auth beautifulsoup4 requests

      - name: Exécuter le script Python
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: python script.py
