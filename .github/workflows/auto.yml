name: Calcul SST Quotidien

on:
  schedule:
    # S'exécute automatiquement TOUS LES JOURS à 02:30 UTC
    # (Soit précisément à 04h30 du matin, heure de Paris)
    - cron: '14 2 * * *'
  workflow_dispatch: # Vous permet de conserver le bouton manuel en journée au cas où

jobs:
  run-sst:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      # --- 1. E-MAIL AU DÉMARRAGE RÉEL ---
      - name: Envoyer un e-mail de démarrage
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🤖 [Début] Le robot SST vient de se réveiller !"
          to: benoit.leroy24@gmail.com
          from: "Robot GitHub Actions"
          body: "GitHub vient de lancer l'exécution automatique nocturne. Le scraping des 71 plages démarre."

      # --- 2. EXÉCUTION ---
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les bibliothèques
        run: |
          pip install pandas gspread google-auth playwright
          playwright install chromium

      - name: Exécuter le script Python
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: python script.py

      # --- 3. E-MAIL DE FIN ---
      - name: Envoyer un e-mail de confirmation
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ [Succès] Rapport Quotidien : Températures de la mer"
          to: benoit.leroy24@gmail.com
          from: "Robot GitHub Actions"
          file_body: rapport.txt
